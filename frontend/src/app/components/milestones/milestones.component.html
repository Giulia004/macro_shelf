<ion-card class="fitness-card p-4">
  <div class="d-flex align-items-center gap-2 mb-3">
    <div class="icon-badge trophy-badge">
      <ion-icon name="trophy-outline"></ion-icon>
    </div>
    <span class="text-white fw-bold">Traguardi & Milestone</span>
  </div>

  <div class="d-flex flex-column gap-3">
    @for (m of milestones; track m.title) {
    <div class="milestone-item d-flex align-items-center justify-content-between p-3 rounded-3"
      [class.unlocked]="m.unlocked" [class.locked]="!m.unlocked">
      <div class="d-flex align-items-center gap-3">
        <div class="milestone-icon-wrapper d-flex align-items-center justify-content-center">
          <ion-icon [name]="m.unlocked ? m.icon : 'lock-closed-outline'"></ion-icon>
        </div>
        <div>
          <h6 class="text-white fw-semibold m-0 fs-6">{{ m.title }}</h6>
          <p class="text-muted small m-0">{{ m.desc }}</p>
        </div>
      </div>
      <div>
        @if (m.unlocked) {
        <ion-icon name="checkmark-circle" class="text-success fs-4"></ion-icon>
        } @else {
        <ion-icon name="lock-closed-outline" class="text-muted fs-5"></ion-icon>
        }
      </div>
    </div>
    }
  </div>
</ion-card>
