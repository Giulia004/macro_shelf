<ion-card class="fitness-card p-4">

  <!-- Intestazione della Card -->
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center gap-2">
      <div class="icon-badge stats-badge">
        <ion-icon name="stats-chart-outline"></ion-icon>
      </div>
      <span class="text-white fw-bold">Riepilogo Obiettivo Attuale</span>
    </div>
    <span class="badge bg-success text-dark px-3 py-1 fw-bold rounded-pill">
      {{ user?.goal || 'MAINTENANCE' }}
    </span>
  </div>

  <!-- Box Informativo con i dati reali del DB -->
  <div class="stats-summary-banner p-3 rounded-3 mb-3">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="text-muted small">Tipo di percorso</span>
      <strong class="text-white small">{{ currentGoalLabel }}</strong>
    </div>
    <div class="d-flex align-items-center justify-content-between">
      <span class="text-muted small">Target Calorico Giornaliero</span>
      <strong class="text-white fs-6 text-success">{{ user?.targetCalories || 2000 }} kcal</strong>
    </div>
  </div>

  <!-- Ripartizione Reale dei Macronutrienti Target -->
  <div class="row g-2 text-center">
    <div class="col-4 p-2 rounded-3 macro-box">
      <span class="extra-small-label text-muted d-block">Proteine</span>
      <strong class="text-white">{{ user?.targetProtein || 120 }}g</strong>
    </div>
    <div class="col-4 p-2 rounded-3 macro-box">
      <span class="extra-small-label text-muted d-block">Carbo</span>
      <strong class="text-white">{{ user?.targetCarbs || 200 }}g</strong>
    </div>
    <div class="col-4 p-2 rounded-3 macro-box">
      <span class="extra-small-label text-muted d-block">Grassi</span>
      <strong class="text-white">{{ user?.targetFats || 60 }}g</strong>
    </div>
  </div>

</ion-card>
