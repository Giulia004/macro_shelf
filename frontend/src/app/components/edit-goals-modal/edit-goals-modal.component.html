<ion-header class="ion-no-border modal-header">
  <ion-toolbar class="modal-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" class="close-btn" (click)="dismiss()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Modifica obiettivi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-bg" [fullscreen]="true">
  <main class="modal-page">

    <!-- INTRO -->
    <div class="modal-intro">
      <h2>I tuoi target</h2>
      <p>
        Aggiorna il fabbisogno calorico e la ripartizione
        dei macronutrienti.
      </p>
    </div>

    <!-- CALORIE -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon calories-icon">
          <ion-icon name="flame-outline"></ion-icon>
        </div>
        <span>Calorie giornaliere (kcal)</span>
      </div>

      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.calories" min="500" max="8000">
        </ion-input>
      </div>
    </div>

    <!-- PROTEINE -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon protein-icon">
          <ion-icon name="fitness-outline"></ion-icon>
        </div>
        <span>Proteine (g)</span>
      </div>

      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.proteins" min="0">
        </ion-input>
      </div>
    </div>

    <!-- CARBOIDRATI -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon carbs-icon">
          <ion-icon name="nutrition-outline"></ion-icon>
        </div>
        <span>Carboidrati (g)</span>
      </div>

      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.carbs" min="0">
        </ion-input>
      </div>
    </div>

    <!-- GRASSI -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon fats-icon">
          <ion-icon name="water-outline"></ion-icon>
        </div>
        <span>Grassi (g)</span>
      </div>

      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.fats" min="0">
        </ion-input>
      </div>
    </div>

    <!-- CALCOLO GUIDATO -->
    <section class="help-section">
      <button type="button" class="help-card" (click)="openCaloriesCalculator()">

        <div class="help-icon-wrapper">
          <ion-icon name="calculator-outline"></ion-icon>
        </div>

        <div class="help-content">
          <span>CALCOLO GUIDATO</span>
          <h3>Non conosci il tuo fabbisogno?</h3>
          <p>
            Rispondi ad alcune domande e scopri il tuo
            target calorico ideale.
          </p>
        </div>

        <div class="help-chevron">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>

      </button>
    </section>

    <!-- PULSANTE DI SALVATAGGIO -->
    <div class="modal-actions">
      <ion-button expand="block" class="save-modal-button" (click)="save()" [disabled]="isSaving">

        <ion-icon name="save-outline" slot="start"></ion-icon>

        {{ isSaving ? 'Salvataggio in corso...' : 'Salva modifiche' }}

      </ion-button>
    </div>

  </main>
</ion-content>
