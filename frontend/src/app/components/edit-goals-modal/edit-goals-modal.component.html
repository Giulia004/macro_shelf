<ion-header class="ion-no-border modal-header">
  <ion-toolbar class="modal-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" class="close-btn" (click)="dismiss()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Modifica obiettivi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="modal-bg" [fullscreen]="true">
  <main class="modal-page">

    <div class="modal-intro">
      <h2>I tuoi target</h2>
      <p>Modifica i valori o usa il calcolatore guidato per stimarli.</p>
    </div>

    <!-- CARD "HAI BISOGNO D'AIUTO?" -> APRE IL MODALE SEPARATO -->
    <div class="help-card" (click)="openCalculatorModal()">
      <div class="help-icon-wrapper">
        <ion-icon name="help-circle-outline"></ion-icon>
      </div>
      <div class="help-content">
        <h3>Hai bisogno d'aiuto?</h3>
        <p>Calcola il fabbisogno ideale rispondendo a qualche domanda.</p>
      </div>
    </div>

    <!-- INPUT CALORIE -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon calories-icon">
          <ion-icon name="flame-outline"></ion-icon>
        </div>
        <span>Calorie (kcal)</span>
      </div>
      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.calories" min="500" max="8000"></ion-input>
      </div>
    </div>

    <!-- INPUT PROTEINE -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon protein-icon">
          <ion-icon name="fitness-outline"></ion-icon>
        </div>
        <span>Proteine (g)</span>
      </div>
      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.proteins" min="0"></ion-input>
      </div>
    </div>

    <!-- INPUT CARBOIDRATI -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon carbs-icon">
          <ion-icon name="nutrition-outline"></ion-icon>
        </div>
        <span>Carboidrati (g)</span>
      </div>
      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.carbs" min="0"></ion-input>
      </div>
    </div>

    <!-- INPUT GRASSI -->
    <div class="input-card">
      <div class="input-card-header">
        <div class="macro-icon fats-icon">
          <ion-icon name="water-outline"></ion-icon>
        </div>
        <span>Grassi (g)</span>
      </div>
      <div class="input-wrapper">
        <ion-input type="number" [(ngModel)]="editableGoals.fats" min="0"></ion-input>
      </div>
    </div>

    <!-- PULSANTE SALVA -->
    <div class="modal-actions">
      <ion-button expand="block" class="save-modal-button" (click)="save()" [disabled]="isSaving">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        {{ isSaving ? 'Salvataggio in corso...' : 'Salva modifiche' }}
      </ion-button>
    </div>

  </main>
</ion-content>
