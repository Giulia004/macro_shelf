<ion-header class="ion-no-border">
  <ion-toolbar class="fitness-toolbar px-2">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title class="text-white fw-bold brand-title">Gestione Obiettivi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="fitness-bg ion-padding">
  <div class="dashboard-container mx-auto py-2 d-flex flex-column gap-3">

    <!-- Card di Riepilogo Obiettivo Attuale -->
    <ion-card class="fitness-card p-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="d-flex align-items-center gap-2">
          <div class="icon-badge nutrition-badge">
            <ion-icon name="flag-outline"></ion-icon>
          </div>
          <span class="text-white fw-bold">Obiettivo Attuale</span>
        </div>
        <span class="badge bg-success text-dark px-3 py-2 fw-bold rounded-pill">{{ user()?.goal || 'MAINTENANCE'
          }}</span>
      </div>

      <div class="row text-center mt-3 g-2">
        <div class="col-3">
          <span class="text-muted extra-small-label d-block">Calorie</span>
          <strong class="text-white fs-6">{{ user()?.targetCalories || 2000 }}</strong>
        </div>
        <div class="col-3">
          <span class="text-muted extra-small-label d-block">Proteine</span>
          <strong class="text-white fs-6">{{ user()?.targetProtein || 120 }}g</strong>
        </div>
        <div class="col-3">
          <span class="text-muted extra-small-label d-block">Carbo</span>
          <strong class="text-white fs-6">{{ user()?.targetCarbs || 200 }}g</strong>
        </div>
        <div class="col-3">
          <span class="text-muted extra-small-label d-block">Grassi</span>
          <strong class="text-white fs-6">{{ user()?.targetFats || 60 }}g</strong>
        </div>
      </div>
    </ion-card>

    <!-- Pulsante per aprire il Modale di Modifica -->
    <button (click)="openEditModal()"
      class="btn btn-success w-100 py-3 rounded-4 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2 action-save-btn">
      <ion-icon name="create-outline" class="fs-5"></ion-icon>
      Modifica Obiettivo & Target
    </button>

    <!-- Componente Milestone -->
    <app-milestones></app-milestones>

    <!-- Componente Trend Statistiche -->
    <app-goal-stats-trend [user]="user()"></app-goal-stats-trend>

  </div>
</ion-content>
