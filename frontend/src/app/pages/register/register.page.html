<ion-content class="ion-padding fitness-bg">
  <div class="register-container d-flex flex-column justify-content-between h-100 mx-auto">

    <!-- Top Nav con freccia per tornare al login o home -->
    <div class="top-nav d-flex justify-content-start">
      <ion-button fill="clear" routerLink="/login" class="back-btn">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Blocco Centrale (Badge, Titolo, Form, Azioni) -->
    <div class="register-content-center d-flex flex-column align-items-center w-100">

      <div class="register-header text-center mb-4">
        <div class="mini-badge mx-auto d-flex align-items-center justify-content-center mb-3">
          <ion-icon name="nutrition-outline"></ion-icon>
        </div>
        <h1 class="fw-bold text-white mb-1">Crea Account</h1>
        <p class="fw-bold text-white small">Inizia a gestire la tua dispensa con MacroShelf.</p>
      </div>

      <div class="form-group d-flex flex-column gap-3 w-100 mb-4">
        <ion-item class="custom-item" lines="none">
          <ion-icon name="person-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input label="Nome" labelPlacement="stacked" type="text" name="name" [(ngModel)]="name"
            autocomplete="given-name" maxlength="80" placeholder="Il tuo nome"></ion-input>
        </ion-item>

        <ion-item class="custom-item" lines="none">
          <ion-icon name="person-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input label="Cognome" labelPlacement="stacked" type="text" name="surname" [(ngModel)]="surname"
            autocomplete="family-name" maxlength="80" placeholder="Il tuo cognome"></ion-input>
        </ion-item>

        <ion-item class="custom-item" lines="none">
          <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input label="Email" labelPlacement="stacked" type="email" [(ngModel)]="email"
            placeholder="nome@esempio.com"></ion-input>
        </ion-item>

        <ion-item class="custom-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input label="Password" labelPlacement="stacked" type="password" [(ngModel)]="password"
            placeholder="••••••••"></ion-input>
        </ion-item>
      </div>

      <div class="register-actions w-100 text-center">
        <ion-button expand="block" (click)="onRegister()" class="btn-primary-fitness mb-3">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          REGISTRATI
        </ion-button>

        <a routerLink="/login" class="text-decoration-none btn-link-fitness d-inline-block mt-2">
          Hai già un account? <span class="ms-1">Accedi</span>
        </a>
      </div>

    </div>

    <!-- Spaziatore vuoto per bilanciare la top-nav -->
    <div class="bottom-spacer"></div>

  </div>
</ion-content>
