<ion-content class="login-bg">
  <main class="login-container">

    <!-- Torna alla Home -->
    <div class="top-nav">
      <ion-button fill="clear" routerLink="/" class="back-button" aria-label="Torna alla Home">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>

    <!-- Intestazione -->
    <section class="login-header">
      <div class="brand-mark">
        <ion-icon name="leaf-outline"></ion-icon>
      </div>

      <span class="login-eyebrow">MACROSHELF</span>
      <h1>Bentornato!</h1>

      <p>
        Accedi alla tua area personale e scopri cosa puoi preparare
        con gli ingredienti che hai già in casa.
      </p>
    </section>

    <!-- Form -->
    <section class="login-card">

      <div class="form-field">
        <ion-item class="custom-item" lines="none">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input label="Email" labelPlacement="floating" type="email" autocomplete="email" inputmode="email"
            [(ngModel)]="email" placeholder="nome@esempio.com">
          </ion-input>
        </ion-item>
      </div>

      <div class="form-field">
        <ion-item class="custom-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input label="Password" labelPlacement="floating" type="password" autocomplete="current-password"
            [(ngModel)]="password" placeholder="Inserisci la password">
          </ion-input>
        </ion-item>
      </div>

      @if(loginMessage){
      <!-- Errore di autenticazione -->
      <p class="login-message" role="alert">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ loginMessage }}
      </p>
      }

      <!-- Accesso -->
      <ion-button expand="block" class="login-submit" (click)="onLogin()">
        <ion-icon name="log-in-outline" slot="start"> <span>Entra</span></ion-icon>
      </ion-button>

      <p class="register-prompt">
        Non hai ancora un account?
        <a routerLink="/register">Registrati</a>
      </p>
    </section>

    <!-- Footer -->
    <footer class="login-footer">
      Meno sprechi, più idee in cucina.
    </footer>

  </main>
</ion-content>
