<ion-header class="ion-no-border profile-header">
  <ion-toolbar class="profile-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" class="back-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Il tuo account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="profile-bg" [fullscreen]="true">
  <main class="profile-page">

    <!-- INTRODUZIONE / AVATAR -->
    <section class="profile-intro-card">
      <div class="profile-avatar-box">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <h2>{{ name ? (name + ' ' + surname) : 'Utente MacroShelf' }}</h2>
      <p>{{ email }}</p>
    </section>

    <!-- FORM DATI PERSONALI -->
    <section class="profile-section">
      <h2 class="section-title">Informazioni personali</h2>

      <div class="profile-card">
        <div class="input-group">
          <label>Nome</label>
          <div class="input-wrapper readonly-field">
            <ion-icon name="person-outline"></ion-icon>
            <ion-input [value]="name" readonly placeholder="Non impostato"></ion-input>
          </div>
        </div>

        <div class="input-divider"></div>

        <div class="input-group">
          <label>Cognome</label>
          <div class="input-wrapper readonly-field">
            <ion-icon name="person-outline"></ion-icon>
            <ion-input [value]="surname" readonly placeholder="Non impostato"></ion-input>
          </div>
        </div>

        <div class="input-divider"></div>

        <div class="input-group">
          <label>Indirizzo Email</label>
          <div class="input-wrapper readonly-field">
            <ion-icon name="mail-outline"></ion-icon>
            <ion-input [value]="email" readonly></ion-input>
          </div>
        </div>

        <!-- PULSANTE APERTURA MODALE MODIFICA -->
        <div class="profile-actions-row">
          <ion-button expand="block" class="edit-profile-button" (click)="openEditModal()" [disabled]="isLoading">
            <ion-icon name="create-outline" slot="start"></ion-icon>
            Modifica informazioni
          </ion-button>
        </div>
      </div>
    </section>

    <!-- SICUREZZA -->
    <section class="profile-section">
      <h2 class="section-title">Sicurezza</h2>

      <div class="profile-card security-card" role="button" tabindex="0">
        <div class="security-info">
          <div class="security-icon">
            <ion-icon name="key-outline"></ion-icon>
          </div>
          <div class="security-text">
            <h3>Modifica password</h3>
            <p>Aggiorna le credenziali di accesso al tuo account</p>
          </div>
          <ion-icon name="chevron-forward-outline" class="item-chevron"></ion-icon>
        </div>
      </div>
    </section>

  </main>
</ion-content>
